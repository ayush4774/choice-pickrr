<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let's Blow Your Choices</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0B0B0E;--bg2:#18151B;--blood:#7A2331;--gold:#C9A227;
  --light:#E4C567;--bone:#EDE6D6;--purple:#4A2E4F;--dim:#6b6670
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 20%,#201a22,var(--bg) 65%);
  color:var(--bone);font-family:Spectral,serif
}
body{
  display:flex;flex-direction:column;align-items:center;
  padding:44px 20px 56px;gap:26px
}
h1{
  font:600 italic clamp(30px,6vw,46px) "Cormorant Garamond";
  margin:0;color:var(--light);text-align:center
}
.sub{
  color:#a89fae;font-size:15px;margin-top:-14px;
  text-align:center;max-width:400px
}
.altar{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;
  gap:18px 22px;min-height:150px;width:min(92vw,700px);padding:10px
}
.candle{
  display:flex;flex-direction:column;align-items:center;
  width:56px;transition:opacity .6s
}
.flame-wrap{
  position:relative;height:26px;display:flex;align-items:flex-end;
  justify-content:center;margin-bottom:-2px
}
.flame{
  width:13px;height:20px;border-radius:50% 50% 50% 0;
  background:linear-gradient(160deg,#ffe08a,#ffa23d 55%,#d8532b);
  transform:rotate(-45deg);
  box-shadow:0 0 12px 3px #ffa03c8c;
  animation:flicker 1.8s ease-in-out infinite
}
.smoke{
  position:absolute;bottom:14px;left:50%;width:6px;height:6px;
  border-radius:50%;background:#999a9a88;opacity:0;
  transform:translateX(-50%)
}
.wick{width:2px;height:6px;background:#3a3230}
.wax{
  width:18px;height:56px;background:linear-gradient(#f2e9d6,#d9cdae);
  border-radius:2px 2px 5px 5px
}
.label{
  margin-top:9px;font-size:11.5px;line-height:1.25;text-align:center;
  color:#c9c0cc;max-width:66px;font-style:italic;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden
}
.candle.out .flame{animation:none;opacity:0;transform:rotate(-45deg) scaleY(.1)}
.candle.out .smoke{animation:smoke 1.3s ease-out forwards}
.candle.out .wax{filter:grayscale(.5) brightness(.75)}
.candle.out .label{color:var(--dim)}
.candle.winner .flame{
  animation:big 1.2s ease-in-out infinite;
  box-shadow:0 0 26px 8px #ffbe5ad9
}
.candle.winner .label{color:var(--light);text-shadow:0 0 10px #e4c56799;font-weight:600}

@keyframes flicker{
  0%,100%{transform:rotate(-45deg) scale(1)}
  25%{transform:rotate(-42deg) scale(.94,1.05)}
  50%{transform:rotate(-47deg) scale(1.04,.96)}
  75%{transform:rotate(-44deg) scale(.97,1.02)}
}
@keyframes big{
  0%,100%{transform:rotate(-45deg) scale(1.15)}
  50%{transform:rotate(-46deg) scale(1.3,1.1)}
}
@keyframes smoke{
  0%{opacity:.6;transform:translateX(-50%) scale(.7)}
  100%{opacity:0;transform:translate(-50%,-34px) scale(1.8)}
}

#askBtn{
  background:linear-gradient(#7A2331,#5c1a25);color:var(--bone);
  border:1px solid #8f2c39;padding:12px 32px;border-radius:2px;
  font:600 italic 18px "Cormorant Garamond";cursor:pointer
}
#askBtn:disabled{opacity:.5;cursor:default}

.result{
  min-height:30px;font:600 italic 24px "Cormorant Garamond";
  text-align:center;color:var(--light);opacity:0;transition:.8s
}
.result.show{opacity:1}

.panel{
  width:min(90vw,420px);background:var(--bg2);
  border:1px solid #2c2630;border-radius:4px;padding:20px
}
.row{display:flex;gap:8px;margin-bottom:14px}
input{
  flex:1;padding:10px 12px;border-radius:2px;border:1px solid #3a3340;
  background:#120f15;color:var(--bone);font:15px Spectral
}
button.add{
  background:var(--purple);color:var(--bone);border:1px solid #5e3d66;
  border-radius:2px;padding:0 16px;cursor:pointer
}
#list{
  list-style:none;margin:0;padding:0;display:flex;flex-direction:column;
  gap:6px;max-height:190px;overflow:auto
}
#list li{
  display:flex;align-items:center;justify-content:space-between;
  background:#120f15;border-left:2px solid var(--gold);
  padding:8px 10px;font-size:14.5px
}
#list .label2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list button{
  background:none;border:0;color:#786f80;cursor:pointer
}
.empty,.hint{
  color:#5e5764;font-size:13px;text-align:center;font-style:italic
}
</style>
</head>

<body>

<p class="sub">
  Light a candle for each option. Ask the question, and watch which one refuses to go out.
</p>

<div class="altar" id="altar"></div>
<button id="askBtn">Ask</button>
<div class="result" id="result"></div>

<div class="panel">
  <div class="row">
    <input id="input" placeholder="Add an option…" maxlength="80">
    <button class="add" id="add">Add</button>
  </div>
  <ul id="list"></ul>
  <div class="hint" id="hint"></div>
</div>

let active = [...options];
let busy = false;

const $ = id => document.getElementById(id);
const altar = $("altar"), list = $("list"), result = $("result"),
      input = $("input"), add = $("add"), ask = $("askBtn");

function render(){
  altar.replaceChildren();
  list.replaceChildren();

  if(!active.length){
    const emptyAltar = document.createElement("div");
    emptyAltar.className = "empty";
    emptyAltar.textContent = "No candles lit yet";
    altar.appendChild(emptyAltar);

    const emptyList = document.createElement("li");
    emptyList.className = "empty";
    emptyList.textContent = "No options yet";
    list.appendChild(emptyList);
  }

  active.forEach((x,i)=>{
    const candle = document.createElement("div");
    candle.className = "candle";
    candle.dataset.i = i;

    const flameWrap = document.createElement("div");
    flameWrap.className = "flame-wrap";
    const flame = document.createElement("div");
    flame.className = "flame";
    flame.style.animationDelay = `-${Math.random()*2}s`;
    const smoke = document.createElement("div");
    smoke.className = "smoke";
    flameWrap.append(flame, smoke);

    const wick = document.createElement("div");
    wick.className = "wick";
    const wax = document.createElement("div");
    wax.className = "wax";
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = x;
    candle.append(flameWrap, wick, wax, label);
    altar.appendChild(candle);

    const item = document.createElement("li");
    const itemLabel = document.createElement("span");
    itemLabel.className = "label2";
    itemLabel.textContent = x;
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "✕";
    remove.setAttribute("aria-label", `Remove ${x}`);
    remove.addEventListener("click", () => removeOption(i));
    item.append(itemLabel, remove);
    list.appendChild(item);
  });

  $("hint").textContent = active.length < 2 && active.length
    ? "Add at least one more option to ask" : "";

  ask.disabled = active.length < 2;
}

function removeOption(i){
  if(busy)return;
  active.splice(i,1);
  reset();
  render();
}

function reset(){
  result.classList.remove("show");
  result.textContent = "";
}

function addOption(){
  const x = input.value.trim();
  if(!x)return;
  active.push(x);
  input.value = "";
  reset();
  render();
  input.focus();
}

add.onclick = addOption;
input.onkeydown = e => e.key === "Enter" && addOption();

ask.onclick = ()=>{
  if(busy || active.length<2)return;

  busy = true;
  ask.disabled = true;
  reset();

  const candles = [...altar.children];
  const winner = Math.floor(Math.random()*active.length);
  const losers = candles.map((_,i)=>i).filter(i=>i!==winner);

  /* Eliminate candles in batches instead of one every 600ms.
     This keeps 365 choices playable. */
  const batches = Math.min(12, losers.length);
  const shuffled = losers.sort(()=>Math.random()-.5);
  const size = Math.ceil(shuffled.length/batches);

  shuffled.forEach((i,n)=>{
    setTimeout(
      ()=>candles[i]?.classList.add("out"),
      400 + Math.floor(n/size)*350
    );
  });

  setTimeout(()=>{
    candles[winner]?.classList.add("winner");
    result.textContent = active[winner];
    result.classList.add("show");
    busy = false;
    ask.disabled = false;
  },400+batches*350+700);
};

render();
</script>
